name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: campuscare
  FRONTEND_IMAGE_NAME: campuscare-frontend

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client
      - name: Build frontend
        run: npm run build
      - name: Test backend API
        run: npm test
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Build and push application images
        if: github.event_name == 'push'
        run: |
          docker build -t "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${GITHUB_SHA}" -t "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest" .
          docker build -f k8s/frontend.Dockerfile -t "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${FRONTEND_IMAGE_NAME}:${GITHUB_SHA}" -t "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${FRONTEND_IMAGE_NAME}:latest" .
          docker push "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest"
          docker push "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${FRONTEND_IMAGE_NAME}:${GITHUB_SHA}"
          docker push "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${FRONTEND_IMAGE_NAME}:latest"

  deploy-ec2:
    needs: build-test-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployment secrets
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          printf '%s' "$DEPLOY_ENV_FILE" > .env
          python - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["EC2_SSH_PRIVATE_KEY"].replace("\r\n", "\n")
          if "\\n" in key and "\n" not in key.strip():
            key = key.replace("\\n", "\n")
          if not key.endswith("\n"):
            key += "\n"
          Path("/tmp/campuscare-ec2.pem").write_text(key)
          PY
          chmod 600 /tmp/campuscare-ec2.pem
      - name: Deploy pulled image through existing Ansible playbook
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_USER: ${{ secrets.EC2_SSH_USER }}
        run: |
          RESOLVED_SSH_USER="$EC2_SSH_USER"
          if [ -z "$RESOLVED_SSH_USER" ]; then
            for candidate in ubuntu ec2-user admin; do
              if ssh -i /tmp/campuscare-ec2.pem -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$candidate@$EC2_HOST" "exit 0" >/dev/null 2>&1; then
                RESOLVED_SSH_USER="$candidate"
                break
              fi
            done
          fi
          : "${RESOLVED_SSH_USER:=ubuntu}"
          docker build -t campuscare-ansible ./ansible
          docker run --rm \
            -e REGISTRY_USERNAME -e REGISTRY_TOKEN \
            -v "$PWD:/workspace" -v /tmp/campuscare-ec2.pem:/tmp/student-complaint-key.pem:ro \
            -w /workspace campuscare-ansible \
            ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            --extra-vars "app_image=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ github.sha }} ansible_host=${EC2_HOST} ansible_user=${RESOLVED_SSH_USER}"
      - name: Verify public health endpoint
        run: curl --fail --retry 12 --retry-delay 5 "http://${{ secrets.EC2_HOST }}/api/health"

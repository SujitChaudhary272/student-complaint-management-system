name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FRONTEND_IMAGE_NAME: campuscare-frontend

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    env:
      APPLICATION_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/campuscare:${{ github.sha }}
      APPLICATION_IMAGE_LATEST: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/campuscare:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client
      - name: Build frontend
        run: npm run build
      - name: Test backend API
        run: npm test
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Build and push application images
        if: github.event_name == 'push'
        run: |
          docker build -t "$APPLICATION_IMAGE" -t "$APPLICATION_IMAGE_LATEST" .
          docker build -f k8s/frontend.Dockerfile -t "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${FRONTEND_IMAGE_NAME}:${GITHUB_SHA}" -t "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${FRONTEND_IMAGE_NAME}:latest" .
          docker push "$APPLICATION_IMAGE"
          docker push "$APPLICATION_IMAGE_LATEST"
          docker push "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${FRONTEND_IMAGE_NAME}:${GITHUB_SHA}"
          docker push "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${FRONTEND_IMAGE_NAME}:latest"

  deploy-ec2:
    needs: build-test-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APPLICATION_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/campuscare:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare deployment secrets
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          printf '%s' "$DEPLOY_ENV_FILE" > .env
          printf '%s' "$EC2_SSH_PRIVATE_KEY" > /tmp/campuscare-ec2.pem
          chmod 600 /tmp/campuscare-ec2.pem

      - name: Test SSH connection to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            -i /tmp/campuscare-ec2.pem \
            ubuntu@"$EC2_HOST" \
            "echo SSH connection successful"

      - name: Deploy pulled image through existing Ansible playbook
        env:
          APPLICATION_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/campuscare:${{ github.sha }}
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$APPLICATION_IMAGE"
          docker build -t campuscare-ansible ./ansible

          docker run --rm \
            -e APPLICATION_IMAGE \
            -e REGISTRY_USERNAME \
            -e REGISTRY_TOKEN \
            -v "$PWD:/workspace" \
            -v /tmp/campuscare-ec2.pem:/tmp/student-complaint-key.pem:ro \
            -w /workspace \
            campuscare-ansible \
            ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            --extra-vars "app_image=$APPLICATION_IMAGE ansible_host=${{ secrets.EC2_HOST }} ansible_user=ubuntu ansible_ssh_private_key_file=/tmp/student-complaint-key.pem"

      - name: Verify public health endpoint
        run: |
          curl --fail --retry 12 --retry-delay 5 \
            "http://${{ secrets.EC2_HOST }}/api/health"
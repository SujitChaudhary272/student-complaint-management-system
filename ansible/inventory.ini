; CampusCare Ansible inventory, used inside the campuscare-ansible container.
; After `terraform apply`, replace REPLACE_WITH_TERRAFORM_ELASTIC_IP with:
; terraform -chdir=terraform output -raw elastic_ip
; DEPLOY_AWS.md creates this exact /tmp key path safely inside the container.

[web]
campuscare-server ansible_host=65.2.201.214 ansible_user=ubuntu ansible_ssh_private_key_file=/tmp/student-complaint-key.pem ansible_python_interpreter=/usr/bin/python3 ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

[campuscare:children]
web

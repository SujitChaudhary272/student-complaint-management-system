; CampusCare - Example Ansible Inventory
;
; Replace YOUR_EC2_PUBLIC_IP with the "ec2_public_ip" value shown by
; `terraform output` after running `terraform apply`.
;
; Replace ../campuscare-key.pem with the path to the private key
; that matches the key pair name used in terraform/variables.tf.
; NEVER commit your real .pem file to GitHub.

[campuscare]
YOUR_EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file="D:\Downloads\campuscare-key.pem" ansible_ssh_common_args='-o StrictHostKeyChecking=no'

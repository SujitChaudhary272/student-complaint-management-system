services:
  app:
    build: .
    image: ${APP_IMAGE:-campuscare:local}

    environment:
      NODE_ENV: production
      PORT: 5000
      METRICS_PORT: 9464
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongo:27017/campuscare}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_URL: ${CLIENT_URL:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}

    ports:
      - "${APP_PORT:-80}:5000"
      # Keep metrics on localhost unless the EC2 security group restricts
      # access to the monitoring security group.
      - "${METRICS_BIND_ADDRESS:-0.0.0.0}:9464:9464"

    expose:
      - "9464"

    depends_on:
      mongo:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

    networks:
      - campuscare_internal

  mongo:
    image: mongo:8

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - campuscare_internal

volumes:
  mongo_data:

networks:
  campuscare_internal:
    driver: bridge
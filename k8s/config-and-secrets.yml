apiVersion: v1
kind: ConfigMap
metadata:
  name: campuscare-config
  namespace: campuscare
data:
  NODE_ENV: production
  PORT: "5000"
  MONGODB_URI: mongodb://mongodb:27017/campuscare
  CLIENT_URL: ""
  SEED_DEMO_DATA: "false"
---
# Replace the placeholder before applying. Do not commit a real JWT secret.
apiVersion: v1
kind: Secret
metadata:
  name: campuscare-secrets
  namespace: campuscare
type: Opaque
stringData:
  JWT_SECRET: REPLACE_WITH_A_LONG_RANDOM_SECRET

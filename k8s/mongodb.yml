apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: campuscare
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: campuscare
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongodb }
  template:
    metadata:
      labels: { app: mongodb }
    spec:
      containers:
        - name: mongodb
          image: mongo:8
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
          readinessProbe:
            exec: { command: [mongosh, --quiet, --eval, "db.adminCommand('ping')"] }
            initialDelaySeconds: 10
          livenessProbe:
            exec: { command: [mongosh, --quiet, --eval, "db.adminCommand('ping')"] }
            initialDelaySeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mongodb-data }
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: campuscare
spec:
  type: ClusterIP
  selector: { app: mongodb }
  ports: [{ port: 27017, targetPort: 27017 }]

apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: campuscare }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prometheus-discovery }
rules:
  - apiGroups: [""]
    resources: [nodes, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prometheus-discovery }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-discovery }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: campuscare }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: campuscare }
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: campuscare-backend
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: { names: [campuscare] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: campuscare-backend
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-rules, namespace: campuscare }
data:
  campuscare-alerts.yml: |
    groups:
      - name: campuscare
        rules:
          - alert: CampusCareBackendDown
            expr: up{job="campuscare-backend"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: CampusCare backend is unreachable
              description: Prometheus has been unable to scrape the CampusCare backend for more than five minutes.
          - alert: CampusCareMongoDBDisconnected
            expr: campuscare_mongodb_connected{job="campuscare-backend"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: CampusCare cannot reach MongoDB
              description: The CampusCare backend reports that its MongoDB connection has been unavailable for more than five minutes.
          - alert: CampusCareScrapeMissing
            expr: absent(up{job="campuscare-backend"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: CampusCare scrape target is missing
              description: Prometheus cannot find a CampusCare backend target.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: campuscare }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.0.1
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus]
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: rules, mountPath: /etc/prometheus/rules }
            - { name: storage, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config, items: [{ key: prometheus.yml, path: prometheus.yml }] }
        - name: rules
          configMap: { name: prometheus-rules }
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: campuscare }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]

global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: campuscare-backend
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [campuscare]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: campuscare-backend
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: http
  - job_name: prometheus
    static_configs: [{ targets: [localhost:9090] }]
